name: ci

# 提交级构建检查：push main / 任何 PR（含 release-please PR）都编译验证
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建生成器 + 契约
        run: |
          dotnet build src/WTangent.Components/Generator.csproj -c Release --nologo
          dotnet build src/WTangent.Core/WTangent.Core.csproj -c Release --nologo

      - name: 打包项目（收拢 analyzers + lib）
        run: dotnet build WTangent.Components.csproj -c Release --nologo
